<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Gifting Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Client Gifting Assistant</h1>
      <p>Automate thoughtful gifting for client relationships.</p>
    </header>

    <main>
      <section class="card">
        <h2>1) Professional Profile</h2>
        <form id="professional-form">
          <input name="name" placeholder="Your full name" required />
          <input name="business_type" placeholder="Business type (Lawyer, Banker...)" required />
          <input name="email" type="email" placeholder="Work email" required />
          <input name="card_token" placeholder="Payment token" required />
          <input name="card_last4" placeholder="Card last 4" minlength="4" maxlength="4" required />
          <button type="submit">Save Profile</button>
        </form>
        <p id="professional-status" class="status"></p>
      </section>

      <section class="card">
        <h2>2) Add Client</h2>
        <form id="client-form">
          <input name="professional_id" type="number" placeholder="Professional ID" required />
          <input name="full_name" placeholder="Client full name" required />
          <input name="email" type="email" placeholder="Client email" required />
          <input name="shipping_address" placeholder="Shipping address" required />
          <input name="birthday" type="date" required />
          <input name="budget" type="number" step="0.01" placeholder="Gift budget" required />
          <input name="preferences" placeholder="Preferences (comma-separated tags)" />
          <button type="submit">Add Client</button>
        </form>
      </section>

      <section class="card">
        <h2>3) Occasion + Recommendations</h2>
        <div class="row">
          <input id="occasion-client-id" type="number" placeholder="Client ID" />
          <input id="occasion-name" placeholder="Occasion name" />
          <input id="occasion-date" type="date" />
          <button id="add-occasion-btn">Add Occasion</button>
        </div>

        <div class="row">
          <input id="rec-client-id" type="number" placeholder="Client ID" />
          <input id="rec-occasion" placeholder="Occasion" value="birthday" />
          <button id="load-recs-btn">Get Suggestions</button>
        </div>

        <div id="recommendations"></div>
      </section>

      <section class="card">
        <h2>Dashboard</h2>
        <button id="refresh-dashboard">Refresh</button>
        <pre id="dashboard"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
